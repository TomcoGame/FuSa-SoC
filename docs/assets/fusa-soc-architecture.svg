<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="FuSa-SoC architecture: safety island, proposed security island, integration and assurance">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1529"/><stop offset="1" stop-color="#152c45"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eaf3ff}.title{font-size:29px;font-weight:700}.sub{font-size:14px;fill:#a9bed6}.h{font-size:19px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#b6c7da}</style></defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/><text x="45" y="53" class="title">FuSa-SoC | Safety + Security Architecture</text><text x="45" y="79" class="sub">SentryCore baseline + proposed OpenTitan security integration · conceptual, not certified</text>
<rect x="45" y="112" width="525" height="180" rx="14" fill="#123b38" stroke="#43c5a1" stroke-width="2"/><text x="69" y="146" class="h">SAFETY ISLAND — IMPLEMENTED UPSTREAM</text><text x="69" y="175" class="body">CV32RT triple-core lockstep (TCLS)</text><text x="69" y="201" class="body">ECC-protected memory and error registers</text><text x="69" y="227" class="body">CLIC, timers, AXI and debug interfaces</text><text x="69" y="263" class="small">Source: PULP SentryCore / safety_island</text>
<rect x="630" y="112" width="525" height="180" rx="14" fill="#183456" stroke="#65a7f5" stroke-width="2" stroke-dasharray="8 5"/><text x="654" y="146" class="h">SECURITY ISLAND — PROPOSED</text><text x="654" y="175" class="body">OpenTitan-derived silicon root of trust</text><text x="654" y="201" class="body">Secure boot, cryptography and identity</text><text x="654" y="227" class="body">Lifecycle, attestation and secure update</text><text x="654" y="263" class="small">Not yet integrated into FuSa-SoC</text>
<path d="M570 195 H630" stroke="#e1b66c" stroke-width="3" stroke-dasharray="5 4"/><path d="M616 188 L630 195 L616 202" stroke="#e1b66c" stroke-width="3" fill="none"/>
<rect x="45" y="316" width="1110" height="77" rx="12" fill="#25314a" stroke="#687d9d"/><text x="70" y="346" class="h">CONTROLLED INTEGRATION + ASSURANCE — PLANNED</text><text x="70" y="371" class="body">Safety/security interface · Fault injection · FMEDA/FTA · Requirements traceability · IEC 61508 / ISO 26262 / ISO/SAE 21434</text>
</svg>